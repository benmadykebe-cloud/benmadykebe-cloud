<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Ibrahima Ben Mady Kebe, informatique appliquée et gestion des opérations">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2A40"/>
      <stop offset="1" stop-color="#1A5276"/>
    </linearGradient>
    <style>
      .link { stroke: #5DADE2; stroke-width: 1.6; stroke-dasharray: 6 8; opacity: .55; animation: flow 3s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -56; } }
      .node { fill: #85C1E9; transform-box: fill-box; transform-origin: center; animation: pulse 2.6s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { transform: scale(1); opacity: .95; } 50% { transform: scale(1.7); opacity: .45; } }
      .d1 { animation-delay: .3s; } .d2 { animation-delay: .7s; } .d3 { animation-delay: 1.1s; }
      .d4 { animation-delay: 1.5s; } .d5 { animation-delay: 1.9s; } .d6 { animation-delay: 2.2s; }
      .name { font-family: Arial, Helvetica, sans-serif; font-size: 52px; font-weight: 700; fill: #FFFFFF; }
      .sub { font-family: Arial, Helvetica, sans-serif; font-size: 25px; font-weight: 400; fill: #AED6F1; }
      .tag { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 400; fill: #D6EAF8; letter-spacing: .5px; }
      .bar { fill: #5DADE2; }
    </style>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Réseau animé -->
  <g>
    <line class="link" x1="780" y1="170" x2="900" y2="240"/>
    <line class="link" x1="780" y1="170" x2="840" y2="60"/>
    <line class="link" x1="840" y1="60" x2="950" y2="150"/>
    <line class="link" x1="950" y1="150" x2="900" y2="240"/>
    <line class="link" x1="950" y1="150" x2="1070" y2="70"/>
    <line class="link" x1="950" y1="150" x2="1110" y2="215"/>
    <line class="link" x1="900" y1="240" x2="1010" y2="262"/>
    <line class="link" x1="1010" y1="262" x2="1110" y2="215"/>
    <line class="link" x1="1070" y1="70" x2="1110" y2="215"/>
    <circle class="node" cx="780" cy="170" r="7"/>
    <circle class="node d1" cx="840" cy="60" r="7"/>
    <circle class="node d2" cx="950" cy="150" r="10"/>
    <circle class="node d3" cx="900" cy="240" r="7"/>
    <circle class="node d4" cx="1070" cy="70" r="7"/>
    <circle class="node d5" cx="1110" cy="215" r="8"/>
    <circle class="node d6" cx="1010" cy="262" r="6"/>
  </g>

  <rect class="bar" x="60" y="82" width="64" height="5" rx="2.5"/>
  <text class="name" x="60" y="150">Ibrahima Ben Mady Kebe</text>
  <text class="sub" x="60" y="196">Informatique appliquée × Gestion des opérations</text>
  <text class="tag" x="60" y="240">Réseaux  ·  Données  ·  Opérations   —   Montréal, QC</text>
</svg>
